<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프랜차이즈 카페 신메뉴</title>
<style>
  /* ============================================================
     ★ 여기만 바꾸면 색상이 바뀌어요 (밝은 모드 기준)
     ============================================================ */
  :root {
    --bg: #f5f6fa;          /* 페이지 배경색 */
    --card: #ffffff;        /* 카드 배경색 */
    --text: #222222;        /* 기본 글자색 */
    --muted: #777777;       /* 흐린 글자색 */
    --line: #dddddd;        /* 테두리 색 */
    --accent: #4a6cf7;      /* 포인트 색 (선택된 카페) */
    --new: #e5484d;         /* NEW 표시 색 */
    --warn: #d98a00;        /* 추정·주의 표시 색 */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c; --card: #20232b; --text: #eeeeee;
      --muted: #a0a5b0; --line: #353a45; --accent: #7b93ff; --new: #ff6b70; --warn: #f0b030;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; max-width: 1100px; margin-inline: auto;
    background: var(--bg); color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  button { font: inherit; color: var(--text); cursor: pointer; }

  /* 위쪽 알림 배너 */
  .banner { padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; background: var(--card);
            border: 2px solid var(--line); font-size: 14px; }
  .banner.has-new { border-color: var(--new); }
  .banner b { color: var(--new); }

  /* 카페 선택 버튼 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { position: relative; padding: 9px 14px; border-radius: 20px; border: 2px solid var(--line); background: var(--card); }
  .chip.active { border-color: var(--accent); background: var(--accent); color: #fff; }
  .chip .cnt { font-size: 12px; opacity: .8; margin-left: 4px; }
  .chip .dot { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--new); }

  /* 선택한 카페 안내 */
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .panel-head h2 { margin: 0; font-size: 19px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
  .tag.official { color: var(--accent); border-color: var(--accent); }
  .tag.est { color: var(--warn); border-color: var(--warn); }
  .tag.none { color: var(--muted); border-color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
  .site { font-size: 13px; color: var(--accent); }
  .alert { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--warn); color: var(--warn); font-size: 13px; margin-bottom: 10px; }
  .tools { display: flex; gap: 6px; margin: 8px 0 12px; }
  .tools button { padding: 5px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); font-size: 13px; }
  .tools button.active { border-color: var(--accent); color: var(--accent); font-weight: bold; }

  /* 메뉴 카드 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .item .pic { aspect-ratio: 1 / 1; background: var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 28px; }
  .item .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item .body { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .item .name { font-weight: bold; font-size: 14px; word-break: keep-all; }
  .item .en { font-size: 12px; color: var(--muted); }
  .item .cat { font-size: 12px; color: var(--muted); }
  .item .desc { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badge { font-size: 11px; font-weight: bold; color: #fff; background: var(--accent); border-radius: 10px; padding: 2px 7px; }
  .badge.fresh { background: var(--new); }
  .badge.est { background: var(--warn); }
  .empty { padding: 28px 12px; text-align: center; color: var(--muted); font-size: 14px; background: var(--card); border: 1px dashed var(--line); border-radius: 10px; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
  <h1>☕ 프랜차이즈 카페 신메뉴</h1>
  <p class="sub" id="updated">불러오는 중...</p>

  <div class="banner" id="banner"></div>

  <!-- 카페 선택: 누르면 바로 그 카페의 신메뉴가 보여요 -->
  <div class="chips" id="chips"></div>

  <div id="panel"></div>

  <p class="foot">
    · 신메뉴 정보는 각 카페 <b>공식 사이트</b>에서 매일 자동으로 가져와요. 사이트가 바뀌면 일시적으로 못 가져올 수 있어요.<br>
    · 출시일·가격·판매 매장은 카페마다 달라요. 주문 전에 공식 앱이나 매장에서 꼭 확인해 주세요.
  </p>

<script>
  // ============================================================
  // ★ 여기만 바꾸면 설정이 바뀌어요
  // ============================================================
  const DATA_URL = "data/menus.json";   // 자동 수집 프로그램이 매일 갱신하는 파일
  const FRESH_DAYS = 7;                 // 이 기간 안에 올라온(출시된) 메뉴에 '새로 올라옴'을 붙여요
  const RECENT_DAYS = 30;               // '최근 30일 출시' 보기 기간
  const LAST_KEY = "cafe-last-brand";   // 마지막으로 본 카페 기억용 (저장이 막혀도 괜찮아요)

  let data = null;
  let current = null;       // 지금 선택된 카페 id
  let recentOnly = false;   // '최근 출시만' 보기 여부

  const $ = (id) => document.getElementById(id);
  const MODE_TAG = {
    official:    ["공식 신메뉴 표시", "official"],
    estimated:   ["신메뉴 추정", "est"],
    unsupported: ["자동 확인 불가", "none"],
  };

  // 오늘로부터 며칠 지났는지 (날짜 글자 "YYYY-MM-DD" → 숫자)
  function daysAgo(dateStr) {
    if (!dateStr) return null;
    const [y, m, d] = dateStr.split("-").map(Number);
    const then = new Date(y, m - 1, d);
    const now = new Date(); now.setHours(0, 0, 0, 0);
    return Math.round((now - then) / 86400000);
  }
  // 새로 올라온 메뉴인가? (출시일이 최근이거나, 우리가 최근에 처음 발견했거나)
  function isFresh(i) {
    const a = daysAgo(i.released), b = daysAgo(i.firstSeen);
    return (a !== null && a >= 0 && a <= FRESH_DAYS) || (b !== null && b >= 0 && b <= FRESH_DAYS);
  }
  const fmtDate = (s) => { const [, m, d] = s.split("-"); return Number(m) + "/" + Number(d); };

  // 정렬: 출시일 최신순 → 처음 발견한 날 최신순 → 원래 순서
  function sorted(items) {
    return items.map((it, idx) => ({ it, idx })).sort((x, y) => {
      const rx = x.it.released || "", ry = y.it.released || "";
      if (rx !== ry) return ry.localeCompare(rx);
      const fx = x.it.firstSeen || "", fy = y.it.firstSeen || "";
      if (fx !== fy) return fy.localeCompare(fx);
      return x.idx - y.idx;
    }).map((o) => o.it);
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;   // textContent라서 외부 글이 코드로 실행되지 않아요
    return e;
  }

  // ----- 위쪽 배너 + 카페 버튼 -----
  function renderTop() {
    const fresh = data.brands.map((b) => ({ b, n: b.items.filter(isFresh).length })).filter((x) => x.n > 0);
    const total = fresh.reduce((s, x) => s + x.n, 0);
    const banner = $("banner");
    banner.className = "banner" + (total ? " has-new" : "");
    banner.textContent = "";
    if (total) {
      banner.append("🔔 최근 " + FRESH_DAYS + "일 안에 새로 올라온 메뉴가 ");
      banner.append(Object.assign(el("b", "", total + "개")));
      banner.append(" 있어요 — " + fresh.map((x) => x.b.name + " " + x.n).join(", "));
    } else {
      banner.textContent = "최근 " + FRESH_DAYS + "일 안에 새로 올라온 메뉴는 아직 없어요. 카페를 눌러 현재 신메뉴를 확인해 보세요.";
    }

    const chips = $("chips");
    chips.textContent = "";
    data.brands.forEach((b) => {
      const btn = el("button", "chip" + (b.id === current ? " active" : ""));
      btn.append(b.name);
      if (b.status !== "unsupported") btn.append(el("span", "cnt", String(b.items.length)));
      if (b.items.some(isFresh)) btn.append(el("span", "dot"));
      btn.onclick = () => { current = b.id; recentOnly = false; try { localStorage.setItem(LAST_KEY, b.id); } catch (e) {} render(); };
      chips.append(btn);
    });
  }

  // ----- 선택한 카페의 신메뉴 -----
  function renderPanel() {
    const b = data.brands.find((x) => x.id === current);
    const panel = $("panel");
    panel.textContent = "";
    if (!b) return;

    const head = el("div", "panel-head");
    head.append(el("h2", "", b.name));
    const [label, cls] = MODE_TAG[b.mode] || MODE_TAG.unsupported;
    head.append(el("span", "tag " + cls, label));
    const a = el("a", "site", "공식 사이트에서 보기 ↗");
    a.href = b.site; a.target = "_blank"; a.rel = "noopener noreferrer";
    head.append(a);
    panel.append(head);
    panel.append(el("p", "note", b.note));

    if (b.status === "error") {
      panel.append(el("div", "alert", "⚠ 이번 갱신에서 공식 사이트를 읽지 못했어요. 마지막으로 성공한 목록을 보여드려요. (" + (b.error || "원인 불명") + ")"));
    }
    if (b.status === "unsupported") {
      panel.append(el("div", "empty", "이 카페는 신메뉴를 자동으로 확인할 수 없어요. 위의 '공식 사이트에서 보기'로 직접 확인해 주세요."));
      return;
    }

    // 출시일이 있는 카페만 '최근 출시' 보기 제공
    const hasDates = b.items.some((i) => i.released);
    if (hasDates) {
      const tools = el("div", "tools");
      [["전체 신메뉴 " + b.items.length, false],
       ["최근 " + RECENT_DAYS + "일 출시", true]].forEach(([text, flag]) => {
        const t = el("button", flag === recentOnly ? "active" : "", text);
        t.onclick = () => { recentOnly = flag; renderPanel(); };
        tools.append(t);
      });
      panel.append(tools);
    }

    let items = sorted(b.items);
    if (recentOnly) items = items.filter((i) => { const d = daysAgo(i.released); return d !== null && d >= 0 && d <= RECENT_DAYS; });

    if (items.length === 0) {
      panel.append(el("div", "empty", recentOnly ? "최근 " + RECENT_DAYS + "일 안에 출시된 신메뉴가 없어요." : "지금 공식 사이트에 표시된 신메뉴가 없어요."));
      return;
    }

    const grid = el("div", "grid");
    items.forEach((i) => {
      const card = el("div", "item");
      const pic = el("div", "pic");
      if (i.image && /^https:\/\//.test(i.image)) {
        const img = document.createElement("img");
        img.src = i.image; img.alt = i.name; img.loading = "lazy";
        img.onerror = () => { pic.textContent = "☕"; };   // 사진이 안 열리면 컵 모양으로 대신해요
        pic.append(img);
      } else { pic.textContent = "☕"; }
      card.append(pic);

      const body = el("div", "body");
      const badges = el("div", "badges");
      if (isFresh(i)) badges.append(el("span", "badge fresh", "새로 올라옴"));
      badges.append(el("span", b.mode === "estimated" ? "badge est" : "badge", b.mode === "estimated" ? "신메뉴 추정" : "공식 NEW"));
      body.append(badges);
      body.append(el("div", "name", i.name));
      if (i.en) body.append(el("div", "en", i.en));
      const meta = [i.category, i.released ? fmtDate(i.released) + (b.mode === "estimated" ? " 등록" : " 출시") : ""].filter(Boolean).join(" · ");
      if (meta) body.append(el("div", "cat", meta));
      if (i.desc) body.append(el("div", "desc", i.desc));
      card.append(body);
      grid.append(card);
    });
    panel.append(grid);
  }

  function render() { renderTop(); renderPanel(); }

  // ----- 시작: 데이터 불러오기 -----
  fetch(DATA_URL, { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((j) => {
      data = j;
      const t = new Date(j.generatedAt);
      $("updated").textContent = "마지막 확인: " + t.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) + " · 매일 자동 갱신";
      let last = null;
      try { last = localStorage.getItem(LAST_KEY); } catch (e) {}
      current = data.brands.some((b) => b.id === last) ? last : (data.brands.find((b) => b.items.length) || data.brands[0]).id;
      render();
    })
    .catch(() => {
      $("updated").textContent = "";
      $("banner").textContent = "신메뉴 데이터를 불러오지 못했어요. 파일을 더블클릭해서 연 경우라면, 폴더의 '시작.bat'으로 실행하거나 배포된 주소로 열어 주세요.";
    });
</script>
</body>
</html>
